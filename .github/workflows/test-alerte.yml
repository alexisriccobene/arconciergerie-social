name: Test des alertes
on:
  push:
    branches: [main]
    paths: [.github/workflows/test-alerte.yml]
permissions:
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d '{"title":"Test d alerte ArConciergerie","assignees":["${{ github.repository_owner }}"],"body":"Ceci est un test envoyé par le robot de publication. Si vous recevez cet e-mail, les alertes fonctionnent. Vous pouvez fermer cette alerte avec le bouton Close issue."}' | head -c 300
