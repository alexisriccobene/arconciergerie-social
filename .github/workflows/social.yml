name: Publication réseaux sociaux
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: [.github/social/plan.json, .github/scripts/social.py]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: social
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Publier les posts arrivés à échéance
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.event_name == 'push' && 'verifier' || 'publier' }}
        run: python3 .github/scripts/social.py
      - name: Enregistrer les publications faites
        if: always()
        run: |
          if [ -n "$(git status --porcelain .github/social/publie.json .github/social/etat.json .github/social/inventaire.json)" ]; then
            git config user.name "ArConciergerie publication"; git config user.email "contact@arconciergerie.com"
            git add .github/social/publie.json; [ -f .github/social/etat.json ] && git add .github/social/etat.json; [ -f .github/social/inventaire.json ] && git add .github/social/inventaire.json; git commit -m "Publications faites" && git pull --rebase && git push
          fi
